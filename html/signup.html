<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | DIR’A</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guardian.css">
</head>


<body class="authPage">

  <!-- BACKGROUND -->
  <div class="authBackdrop" aria-hidden="true">
    <div class="authGlow authGlowOne"></div>
    <div class="authGlow authGlowTwo"></div>
    <div class="authGrid"></div>
  </div>


  <main class="authShell">


    <!-- NAV -->
    <nav class="authNav">

      <a
        href="main-home.html"
        class="logo logo-switch authLogo"
        aria-label="DIR’A home"
      >

        <img
          src="images/black-logo.png"
          class="logo-light"
          alt="DIR’A"
        >

        <img
          src="images/white-logo.png"
          class="logo-dark"
          alt="DIR’A"
        >

      </a>


      <div class="authNavActions">

        <button
          onclick="toggleTheme()"
          class="icon authTheme"
          aria-label="Switch theme"
        >
          🌙
        </button>

      </div>

    </nav>



    <!-- SIGNUP CONTENT -->
    <section class="authStage authStageSignup">

      <div class="authContent">

        <h1 class="authTitle">
          Create your<br>
          <em>DIR’A account.</em>
        </h1>


        <p class="authLead">
          Choose your account type and get started with DIR’A.
        </p>



        <form
          id="signupForm"
          class="authForm"
          autocomplete="on"
        >

          <div
            id="signupMessage"
            class="formMessage authMessage"
            hidden
          ></div>



          <!-- ACCOUNT TYPE -->
          <div class="accountTypeSection authAccountTypeSection">

            <p class="accountTypeTitle">
              HOW WILL YOU USE DIR’A?
            </p>


            <div class="accountTypeOptions authRoleOptions">


              <!-- INDIVIDUAL -->
              <button
                type="button"
                class="accountTypeCard authRoleCard"
                data-role="individual"
              >

                <span class="authRoleTop">

                  <span
                    class="accountTypeIcon authRoleIcon"
                    aria-hidden="true"
                  >
                    ◉
                  </span>

                  <span class="authRoleArrow">
                    ↗
                  </span>

                </span>


                <strong>
                  Individual
                </strong>


                <small>
                  Explore games, compare safety levels
                  and submit reports.
                </small>

              </button>



              <!-- EMPLOYEE -->
              <button
                type="button"
                class="accountTypeCard authRoleCard"
                data-role="employee"
              >

                <span class="authRoleTop">

                  <span
                    class="accountTypeIcon authRoleIcon"
                    aria-hidden="true"
                  >
                    ▦
                  </span>

                  <span class="authRoleArrow">
                    ↗
                  </span>

                </span>


                <strong>
                  Employee
                </strong>


                <small>
                  For authorized organization employees
                  reviewing reports.
                </small>

              </button>


            </div>

          </div>



          <!-- FORM FIELDS -->
          <div
            id="signupFields"
            class="signupFields authSignupFields"
            hidden
          >


            <div class="row">


              <div class="field">

                <label for="firstName">
                  First name
                </label>

                <input
                  id="firstName"
                  name="first_name"
                  placeholder="Enter your first name"
                  required
                >

              </div>



              <div class="field">

                <label for="lastName">
                  Last name
                </label>

                <input
                  id="lastName"
                  name="last_name"
                  placeholder="Enter your last name"
                  required
                >

              </div>


            </div>



            <div class="field">

              <label
                id="emailLabel"
                for="signupEmail"
              >
                Email
              </label>


              <input
                id="signupEmail"
                name="email"
                type="email"
                placeholder="Enter your email"
                required
              >


              <small
                id="employeeEmailHint"
                class="passwordHint"
                hidden
              >
                Please use your organization or work email.
                Personal email addresses are not accepted.
              </small>

            </div>



            <div class="field">

              <label for="signupPassword">
                Password
              </label>


              <input
                id="signupPassword"
                name="password"
                type="password"
                placeholder="Create a password"
                required
              >


              <small class="passwordHint">
                At least 8 characters with both letters and numbers.
              </small>

            </div>



            <button
              id="signupBtn"
              class="btn light authSubmit"
              type="submit"
            >
              Create Account
              <span>→</span>
            </button>


            <p class="authSwitchText">
              Already have an account?
              <a href="login.html">
                Log in
              </a>
            </p>


          </div>

        </form>


      </div>

    </section>

  </main>



  <!-- DIR'A GUARDIAN -->
  <div
    id="dirGuardian"
    class="dir-guardian auth-dir-guardian"
    aria-hidden="true"
  >

    <div
      class="guardian-symbol"
      id="guardianSymbol"
    ></div>


    <div class="guardian-body-wrap">

      <div class="guardian-shadow"></div>

      <div class="guardian-neck"></div>


      <div class="guardian-head-wrap">


          <div class="guardian-head">

  <div class="guardian-ear guardian-ear-left"></div>
  <div class="guardian-ear guardian-ear-right"></div>

  <div class="guardian-face">
    <span class="guardian-eye guardian-eye-left"></span>
    <span class="guardian-eye guardian-eye-right"></span>
  </div>

  <!-- EMPLOYEE GLASSES -->
  

      </div>


      <div class="guardian-body"></div>

      <div class="guardian-arm guardian-arm-left"></div>

      <div class="guardian-arm guardian-arm-right"></div>

      <!-- AUTH ACCESSORIES -->

<div class="guardian-game-device" aria-hidden="true">
  <div class="game-screen"></div>
  <div class="game-dpad">+</div>

  <div class="game-buttons">
    <span></span>
    <span></span>
  </div>
</div>


<div class="guardian-glasses" aria-hidden="true">
  <span class="glasses-lens glasses-left"></span>
  <span class="glasses-bridge"></span>
  <span class="glasses-lens glasses-right"></span>
</div>


<div class="guardian-laptop" aria-hidden="true">
  <div class="laptop-screen">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="laptop-base"></div>
</div>

    </div>

  </div>



  <script src="js/common.js"></script>

  <script src="js/guardian.js"></script>

  <script src="js/signup.js"></script>

</body>

</html>
